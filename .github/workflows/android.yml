name: Unity Android

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Unity project files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Unity project structure
        shell: bash
        run: |
          set -euxo pipefail
          test -f ProjectSettings/ProjectVersion.txt
          test -f ProjectSettings/EditorBuildSettings.asset
          test -f Assets/Scenes/Main.unity
          test -f Assets/Scripts/FishingGame.cs
          grep -q 'm_EditorVersion: 6000.0.23f1' ProjectSettings/ProjectVersion.txt
          python3 - <<'PY'
          from pathlib import Path
          script = Path("Assets/Scripts/FishingGame.cs").read_text(encoding="utf-8")
          assert "class FishingGame" in script
          assert "BuildWorld" in script and "BuildUI" in script
          print("Unity project structure checks passed.")
          PY

  build-android:
    name: Build Android APK with Unity
    if: ${{ vars.UNITY_ANDROID_BUILD == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Android player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: 6000.0.23f1
          targetPlatform: Android
          buildName: FishingLegend
          buildsPath: build
          androidAppBundle: false
      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: FishingLegend-Unity-Android
          path: build
          if-no-files-found: error
          retention-days: 14
